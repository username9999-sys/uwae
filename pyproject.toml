[project]
name = "universal-web-acquisition"
version = "0.1.0"
description = "A Python-first, CLI-first web acquisition engine designed to compete with Botasaurus"
authors = [
    {name = "Universal Web Acquisition Engine Team", email = "dev@uwae.example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["web acquisition", "scraping", "botasaurus", "http", "browser", "extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "joblib>=1.4.0",
    "psutil>=5.9.0"
]

[project.urls]
Homepage = "https://github.com/universal-web-acquisition/uwae"
Documentation = "https://github.com/universal-web-acquisition/uwae#readme"
Repository = "https://github.com/universal-web-acquisition/uwae"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
]

[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
uwae = "universal_web_acquisition.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "*test*", "docs*", "examples*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "C90", "I"]
ignore = ["E501", "E203", "W503", "E231", "E241", "E302", "E305", "E741"]

[tool.ruff.per-file-ignore]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S106", "S113", "S114"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | .hg
  | .mypy_cache
  | .tox
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["universal_web_acquisition"]
known_third_party = ["click", "rich", "pyyaml", "joblib", "psutil", "httpx", "requests", "beautifulsoup4", "lxml", "sqlalchemy", "alembic", "pydantic", "python-dotenv"]
